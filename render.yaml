# Render Blueprint — https://render.com/docs/blueprint-spec
# In Render: New → Blueprint → select this repo. Secrets marked `sync: false`
# are prompted for in the dashboard and are never stored in git.
services:
  - type: web
    name: smartmart-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "false"
      - key: CORS_ORIGIN
        sync: false
